# CFG LOADBALANCER NEWBIE STORE [ xxx ]
global       
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 1d

       log /dev/log local0
#       log /dev/log local1 notice
#       log /dev/log local0 info
    
    tune.h2.initial-window-size 2147483647
    tune.ssl.default-dh-param 2048

    pidfile /run/haproxy.pid
    chroot /var/lib/haproxy

    user haproxy
    group haproxy
    daemon

    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

defaults
    log global
    mode tcp
    option tcplog
#    option httplog
    option dontlognull
    timeout connect 60s          # Timeout connect ditingkatkan untuk mencegah timeout yang terlalu cepat
    timeout client  300s
    timeout server  300s


frontend http_frontend
    mode tcp
    bind *:80 tfo
    bind *:8080 tfo
    bind *:8880 tfo
    bind *:2080 tfo
    bind *:2082 tfo
    
    # Beri jeda agar paket payload datang dan bisa diinspeksi
    tcp-request inspect-delay 500ms
    
    # WAJIB: Izinkan HAProxy mengurai (parse) lalu lintas jika terdeteksi sebagai HTTP
    tcp-request content accept if HTTP
    
    # 1. Deteksi SSH (Sintaks modern, menangkap "SSH-")
    acl is_ssh req.payload(0,4) -m str SSH-
    
    # 2. Deteksi Websocket
    acl is_websocket hdr(Upgrade) -i websocket
    
    # 3. Deteksi URL Path (Sintaks modern pengganti path_reg) - Menangkap request seperti /vmess atau /trojan
    acl is_http_path path -m reg -i ^\/(.*)
    
    # ROUTING
    # Jika trafik berupa Websocket ATAU memiliki HTTP Path, lempar ke backend VPN (Nginx)
    use_backend ws_backend if is_websocket || is_http_path
    
    # Jika tidak memenuhi syarat di atas (contoh: murni SSH), lempar ke SSH
    default_backend dropbear_backend

frontend https_frontend
    bind *:443 ssl crt /etc/haproxy/hap.pem tfo alpn h2,http/1.1
    mode tcp
    option tcplog
    
    tcp-request inspect-delay 500ms
    tcp-request content accept if { req.ssl_hello_type 1 }
    
    # Izinkan inspeksi HTTP setelah SSL dibuka oleh HAProxy
    tcp-request content accept if HTTP
    
    # 1. Deteksi HTTP/2 (gRPC)
    acl is_http2 ssl_fc_alpn -i h2
    
    # 2. Deteksi Websocket SSL dan URL Path murni
    acl is_websocket_ssl hdr(Upgrade) -i websocket
    acl is_http_path path -m reg -i ^\/(.*)

    # ROUTING
    use_backend grpc_backend if is_http2
    use_backend ws_backend if is_websocket_ssl || is_http_path
    
    default_backend dropbear_backend

backend dropbear_backend
    mode tcp               # Ubah dari mode http ke mode tcp untuk Dropbear (SSH)
    server dropbear_server 127.0.0.1:2223 check

backend ws_backend
    mode tcp
    server ws_server 127.0.0.1:1010 check

backend grpc_backend
    mode tcp
    server grpc_server 127.0.0.1:1013 check

